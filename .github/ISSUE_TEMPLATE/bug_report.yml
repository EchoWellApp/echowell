name: Bug report
description: Report a defect (TRD 18 GIT-072). Never include secrets, real resident data or log extracts beyond IDs and timestamps (GIT-073).
labels: ["type:bug"]
body:
  - type: textarea
    id: what-happened
    attributes: { label: What happened }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: "local, staging or production; commit SHA" }
    validations: { required: true }
  - type: input
    id: request-reference
    attributes: { label: Request reference, description: "X-Request-ID or pipeline run ID, if any" }
