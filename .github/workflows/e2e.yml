# E2E, performance and nightly workflow (TRD 16 §4.3, CIC-030..CIC-037, CIC-112, CIC-116; TRD 13 TST-004,
# TST-005, TST-084, TST-100, TST-110, TST-125, TST-150, TST-151; TRD 24 D-72..D-74; FEAT-080).
# - playwright (required check, CIC-070): Compose demo stack (db, backend, frontend-prod :3001) seeded with
#   seed test_v0_1 + DS-10; Chromium on pull requests and pushes, Chromium/Firefox/WebKit on the schedule;
#   then the @isolated scenarios on a second database echowell_demo.
# - performance, nightly-validation: schedule and manual dispatch only (CIC-035, CIC-037), not required.
# - lighthouse: pull requests to main, not required (CIC-116).
# - ci-failure-issue: a failing scheduled or main run opens or comments on a `ci-failure` issue (CIC-033).
# No repository secret is used: E2E credentials are generated and masked per job (CIC-034, CIC-090).
name: E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC, after the 07:00/08:00 UTC nightly run window
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  E2E_BASE_URL: http://localhost:3001
  # Browser projects: one Playwright invocation per project and group (D-73). The nightly schedule and a
  # manual dispatch run all three engines (TST-100); pull requests and pushes run Chromium only.
  BROWSERS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium firefox webkit' || 'chromium' }}
jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Stack .env from the development template, per-run JWT_SECRET
        run: |
          cp .env.development.example .env
          sed -i '/^JWT_SECRET=/d' .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
      - name: Login limit 60/minute for the E2E stack only (D-74, TRD 21 ENV-054)
        run: sed -i 's#^RATE_LIMIT_LOGIN=.*#RATE_LIMIT_LOGIN=60/minute#' .env
      - name: Per-job seed credentials (TRD 21 SEED_*, masked, never printed; CIC-034)
        run: |
          for v in SEED_ADMIN_PASSWORD SEED_CLINICIAN_PASSWORD SEED_RESEARCHER_PASSWORD; do
            val="E2e-$(openssl rand -hex 16)"; echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"; sed -i "/^$v=/d" .env; echo "$v=$val" >> .env
          done
          key="ewk_$(openssl rand -hex 24)"; echo "::add-mask::$key"
          echo "SEED_INGEST_API_KEY=$key" >> "$GITHUB_ENV"; sed -i "/^SEED_INGEST_API_KEY=/d" .env; echo "SEED_INGEST_API_KEY=$key" >> .env
      - name: Start the Compose demo stack (healthchecks on backend and frontend-prod)
        run: docker compose --profile demo up -d --build --wait db backend frontend-prod
      - name: Seed test_v0_1 (roster + SRC-05 + pipeline, D-68)
        run: docker compose exec -T backend python -m backend.cli seed test_v0_1
      - name: Load DS-10 ground truth (E2E-20)
        run: docker compose exec -T backend python database/seeds/load_evaluation_ground_truth.py tests/fixtures/answer_key/evaluation_ground_truth_v0_1.csv
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Playwright browsers
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps $BROWSERS
      - name: Main run, one browser project at a time (TRD 24 D-73)
        working-directory: frontend
        # globalSetup (tests/e2e/global-setup.ts) runs before each invocation: seed test_v0_1 --reset + DS-10
        # loader, docker compose restart backend, one login per role with the masked SEED_* values (D-73, D-74).
        run: |
          # Every project runs even when an earlier one fails, so a nightly run reports all three engines (issue #37).
          fail=0
          for p in $BROWSERS; do
            # read-only scenarios on the pristine seed (--grep-invert "@isolated|@mutating")
            PLAYWRIGHT_HTML_OUTPUT_DIR="$PWD/playwright-report/$p-readonly" npm run test:e2e:readonly -- --project=$p || fail=1
            # @mutating group, --workers=1: E2E-18; FE-193 snooze step; E2E-09 (FE-187), D-118
            PLAYWRIGHT_HTML_OUTPUT_DIR="$PWD/playwright-report/$p-mutating" npm run test:e2e:mutating -- --project=$p || fail=1
          done
          exit $fail
      - name: Isolated database echowell_demo for E2E-15, E2E-19, TST-187 (CIC-030; the main DB stays the test_v0_1 seed)
        run: |
          docker compose exec -T db psql -U echowell -d echowell -v ON_ERROR_STOP=1 -c "CREATE DATABASE echowell_demo"
          # same provisioning as the main database: extensions, timezone UTC (D-72), roles (idempotent)
          docker compose exec -T db psql -U echowell -d echowell_demo -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/10_provision_login_roles.sql
          DEMO="-e PIPELINE_AS_OF= -e DATABASE_URL=postgresql+psycopg://echowell_app_login:local-dev-only-app@db:5432/echowell_demo -e DATABASE_MIGRATION_URL=postgresql+psycopg://echowell_migrator_login:local-dev-only-migrator@db:5432/echowell_demo -e DATABASE_READONLY_URL=postgresql+psycopg://echowell_readonly_login:local-dev-only-readonly@db:5432/echowell_demo"
          docker compose stop backend
          docker compose run -d --no-deps --service-ports $DEMO backend   # service command: alembic upgrade head, then uvicorn :8000
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 -o /dev/null http://localhost:8000/api/v1/health
          docker compose run --rm --no-deps $DEMO backend python -m backend.cli seed test_v0_1 --master-only
          docker compose run --rm --no-deps $DEMO backend python -m backend.cli import-master-data --dir tests/fixtures/seeds/demo_overlay
      - name: Isolated run (Chromium, serial; isolated-setup.ts logs in once per role, D-74)
        working-directory: frontend
        run: PLAYWRIGHT_HTML_OUTPUT_DIR="$PWD/playwright-report/chromium-isolated" npm run test:e2e:isolated
      - name: Collect Compose logs
        if: failure()
        run: |
          docker compose logs --no-color > e2e-compose.log
          # the echowell_demo backend runs as a one-off `docker compose run` container
          for c in $(docker ps -aq --filter label=com.docker.compose.project=echowell --filter label=com.docker.compose.oneoff=True); do
            echo "=== one-off container $c" >> e2e-compose.log; docker logs "$c" >> e2e-compose.log 2>&1
          done
      - name: Upload playwright-report (synthetic data only, CIC-101)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            e2e-compose.log
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down the stack
        if: always()
        run: docker compose --profile demo down -v --remove-orphans

  performance: # CIC-035: schedule and manual dispatch only; not a required check (CIC-070)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: echowell, POSTGRES_PASSWORD: ci-only-postgres, POSTGRES_DB: echowell_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echowell -d echowell_test"
          --health-interval 5s --health-retries 10
    env: # identical to ci.yml backend-test (CIC-037); CI-only throwaway values
      APP_ENV: test
      PGPASSWORD: ci-only-postgres # superuser, used only by the provisioning step
      ECHOWELL_MIGRATOR_DB_PASSWORD: ci-only-migrator
      ECHOWELL_APP_DB_PASSWORD: ci-only-app
      ECHOWELL_READONLY_DB_PASSWORD: ci-only-readonly
      DATABASE_URL: postgresql+psycopg://echowell_app_login:ci-only-app@localhost:5432/echowell_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://echowell_migrator_login:ci-only-migrator@localhost:5432/echowell_test
      DATABASE_READONLY_URL: postgresql+psycopg://echowell_readonly_login:ci-only-readonly@localhost:5432/echowell_test
      TEST_SUPERUSER_URL: postgresql+psycopg://echowell:ci-only-postgres@localhost:5432/echowell_test
      FACILITY_NAME: Edgewood
      FACILITY_TZ: America/Chicago
      PIPELINE_PROFILE: test_v0_1
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Provision roles and migrate (as ci.yml backend-test)
        run: |
          psql -h localhost -U echowell -d echowell_test -v ON_ERROR_STOP=1 -f database/roles/provision_login_roles.sql
          alembic upgrade head
      - name: Generate DS-08 (100 residents, 10,800 records; never committed)
        run: python tests/performance/make_load_dataset.py --seed 20261004 --out build/ds08
      - name: Contract R8 budgets and sustained ingest (TST-120..TST-126, TST-190, TST-191)
        run: pytest -p no:randomly tests/performance -m performance --junitxml=build/performance-junit.xml
      - name: Upload performance-report (build/performance.json)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report
          path: |
            build/performance.json
            build/performance-junit.xml
          if-no-files-found: warn
          retention-days: 30

  nightly-validation: # CIC-037: schedule and manual dispatch only; informational, not a required check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: echowell, POSTGRES_PASSWORD: ci-only-postgres, POSTGRES_DB: echowell_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echowell -d echowell_test"
          --health-interval 5s --health-retries 10
    env: # identical to ci.yml backend-test (CIC-037); CI-only throwaway values
      APP_ENV: test
      PGPASSWORD: ci-only-postgres # superuser, used only by the provisioning step
      ECHOWELL_MIGRATOR_DB_PASSWORD: ci-only-migrator
      ECHOWELL_APP_DB_PASSWORD: ci-only-app
      ECHOWELL_READONLY_DB_PASSWORD: ci-only-readonly
      DATABASE_URL: postgresql+psycopg://echowell_app_login:ci-only-app@localhost:5432/echowell_test
      DATABASE_MIGRATION_URL: postgresql+psycopg://echowell_migrator_login:ci-only-migrator@localhost:5432/echowell_test
      DATABASE_READONLY_URL: postgresql+psycopg://echowell_readonly_login:ci-only-readonly@localhost:5432/echowell_test
      TEST_SUPERUSER_URL: postgresql+psycopg://echowell:ci-only-postgres@localhost:5432/echowell_test
      FACILITY_NAME: Edgewood
      FACILITY_TZ: America/Chicago
      PIPELINE_PROFILE: test_v0_1
      CORS_ORIGINS: http://localhost:3000
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Provision roles and migrate (as ci.yml backend-test)
        run: |
          psql -h localhost -U echowell -d echowell_test -v ON_ERROR_STOP=1 -f database/roles/provision_login_roles.sql
          alembic upgrade head
      - name: Suites in random order (pytest-randomly; the seed is printed in the header, TST-005)
        run: >
          pytest -p randomly tests/unit tests/integration tests/contract tests/security tests/validation
          --junitxml=build/nightly-junit.xml
      - name: Multi-seed robustness check (TDV-080..TDV-083, TST-084; informational, never gates)
        # runs only when Optional FEAT-061 is present; without the file the step is skipped (FEAT-080-AC-03)
        if: always() && hashFiles('tests/validation/robustness.py') != ''
        continue-on-error: true
        run: python -m tests.validation.robustness
      - name: Upload nightly-validation-report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-validation-report
          path: |
            build/
            docs/reports/ALGORITHM_VALIDATION_REPORT.md
            docs/reports/validation_results.json
          if-no-files-found: warn
          retention-days: 30

  lighthouse: # CIC-116: pull requests to main only; not a required check (CIC-070)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Stack .env (as playwright), per-job credentials masked
        run: |
          cp .env.development.example .env
          sed -i '/^JWT_SECRET=/d' .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          sed -i 's#^RATE_LIMIT_LOGIN=.*#RATE_LIMIT_LOGIN=60/minute#' .env
          for v in SEED_ADMIN_PASSWORD SEED_CLINICIAN_PASSWORD SEED_RESEARCHER_PASSWORD; do
            val="E2e-$(openssl rand -hex 16)"; echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"; sed -i "/^$v=/d" .env; echo "$v=$val" >> .env
          done
          key="ewk_$(openssl rand -hex 24)"; echo "::add-mask::$key"
          sed -i "/^SEED_INGEST_API_KEY=/d" .env; echo "SEED_INGEST_API_KEY=$key" >> .env
      - run: docker compose --profile demo up -d --build --wait db backend frontend-prod
      - run: docker compose exec -T backend python -m backend.cli seed test_v0_1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lighthouse CI 0.14.x, desktop preset (frontend/lighthouserc.json, scripted admin login frontend/tests/lighthouse/login.js)
        working-directory: frontend
        # puppeteer is needed by lhci for the puppeteerScript login; installed alongside @lhci/cli for this job only
        run: npx --yes -p @lhci/cli@0.14.x -p puppeteer@23 lhci autorun
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            build/lighthouse/
            frontend/.lighthouseci/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose --profile demo down -v --remove-orphans

  ci-failure-issue: # CIC-033: failing scheduled or main run -> open or comment on a `ci-failure` issue
    needs: [playwright, performance, nightly-validation, lighthouse]
    if: >-
      failure() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or comment on the ci-failure issue
        run: |
          body="E2E workflow failed: $RUN_URL (event ${{ github.event_name }}, commit ${{ github.sha }}). Jobs: playwright=${{ needs.playwright.result }}, performance=${{ needs.performance.result }}, nightly-validation=${{ needs.nightly-validation.result }}, lighthouse=${{ needs.lighthouse.result }}."
          gh label create ci-failure --color B60205 --description "Nightly or main CI failure (TRD 13 TST-151)" 2>/dev/null || true
          issue=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "E2E workflow failure on main" --label ci-failure --body "$body"
          fi
