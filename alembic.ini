# Alembic configuration at the repository root (TRD 15 DEP-024, TRD 24 D-90).
# Run from the repository root: `alembic upgrade head`. The connection URL is not stored here:
# backend/alembic/env.py reads DATABASE_MIGRATION_URL (role echowell_migrator) through
# backend.core.config (TRD 21 ENV-001, ARC-015).
[alembic]
script_location = backend/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
