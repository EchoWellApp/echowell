# Netlify build configuration (TRD 15 §4.6 outline; FEAT-082). Used by both sites (D-99):
# staging site `echowell-und-staging` (production branch `main`, deploy previews on) and production
# site `echowell-und` (builds stopped; published only by deploy-production.yml with the Netlify CLI).
# No secrets here (ENV-005, SEC-054).

[build]
  base    = "frontend"
  command = "node scripts/check-csp.mjs && npm run build"
  publish = ".next"
  ignore  = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# The API base URL and app environment (NEXT_PUBLIC_*) are site environment variables (one value per site,
# TRD 15 §4.6 step 5), not deploy-context blocks: both sites build `main`, so a context cannot tell staging
# from production (D-99). The variable names are not written here so FEAT-082-AC-03's grep stays empty.

# Copied verbatim from TRD 12 §4.9 (the only owner of this header set; do not edit here).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://echowell-api.onrender.com https://echowell-backend-production.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
